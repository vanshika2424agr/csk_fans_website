services:
  # ─── Backend: Express API ─────────────────────────────────────────────────────
  - type: web
    name: csk-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false          # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # Set this manually in Render dashboard
      - key: CLIENT_URL
        sync: false          # Set to your frontend Render URL after deploying it

  # ─── Frontend: Vite React Static Site ────────────────────────────────────────
  - type: static
    name: csk-fans
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to your backend Render URL (e.g. https://csk-api.onrender.com)
